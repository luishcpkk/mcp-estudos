spring.application.name=mcp-estudos

# O Claude Desktop conversa com o servidor pela entrada/saída padrão:
# nada pode ser escrito no console.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.pattern.console=
logging.file.name=mcp-estudos.log

spring.ai.mcp.server.name=odonto-mcp
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.instructions=Assistente de agendamento de uma clinica odontologica ficticia. Antes de agendar, confirme com o usuario o paciente, o dentista, a data e o horario. Nunca invente IDs: consulte as ferramentas. Antes de agendar um procedimento para um paciente com condicao clinica relevante (por exemplo hipertensao, diabetes ou gravidez), consulte consultarBaseClinica e informe ao usuario o que o protocolo diz; se a base nao tiver resposta, diga isso em vez de supor.

# Banco SQLite na pasta do usuario (caminho fixo, nao depende de onde o app e iniciado).
# foreign_keys=true: o SQLite ignora FOREIGN KEY por padrao; aqui ela passa a valer em toda conexao.
spring.datasource.url=jdbc:sqlite:${user.home}/odonto-mcp.db?foreign_keys=true
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always

# --- Base clinica (RAG) ---
# Embeddings pelo Ollama local: os documentos clinicos nao saem da maquina.
# Pre-requisito: Ollama em execucao e o modelo baixado (ollama pull bge-m3, multilingue).
# O servidor sobe mesmo sem o Ollama; nesse caso consultarBaseClinica avisa que a base esta indisponivel.
spring.ai.model.chat=none
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=bge-m3

# PDFs lidos na inicializacao (qualquer padrao de recurso do Spring).
# Para usar uma pasta fora do projeto: clinica.rag.docs-location=file:${user.home}/odonto-docs/*.pdf
clinica.rag.docs-location=classpath:docs/*.pdf
clinica.rag.chunk-size=500
clinica.rag.top-k=4
# 0 devolve sempre os top-k trechos (cada um com sua similaridade); suba apos calibrar com seus documentos.
clinica.rag.similarity-threshold=0.0
